

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="music-player">

        <!-- Header -->
        <div class="header">

            <div>
                <p>MUSIC PLAYER</p>
                <h1>Melody<span>Box</span></h1>
            </div>

            <label class="add-music">
                + Add Music

                <input
                    type="file"
                    id="musicInput"
                    accept="audio/*"
                    multiple
                    hidden
                >
            </label>

        </div>


        <!-- Now Playing -->
        <div class="now-playing">

            <div class="album-art" id="albumArt">
                🎵
            </div>

            <div class="song-details">

                <small>NOW PLAYING</small>

                <h2 id="songTitle">
                    No song selected
                </h2>

                <p id="artist">
                    Add a song to start playing
                </p>

            </div>

        </div>


        <!-- Audio -->
        <audio id="audio"></audio>


        <!-- Time -->
        <div class="time">

            <span id="currentTime">
                0:00
            </span>

            <span id="totalTime">
                0:00
            </span>

        </div>


        <!-- Progress Bar -->
        <input
            type="range"
            id="progress"
            min="0"
            max="100"
            value="0"
        >


        <!-- Controls -->
        <div class="controls">

            <button id="shuffle">
                🔀
            </button>

            <button id="previous">
                ⏮
            </button>

            <button id="playPause" class="play">
                ▶
            </button>

            <button id="next">
                ⏭
            </button>

            <button id="repeat">
                🔁
            </button>

        </div>


        <!-- Volume -->
        <div class="volume">

            <span>🔊</span>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
            >

        </div>


        <!-- Playlist -->
        <div class="playlist">

            <div class="playlist-title">

                <h3>My Playlist</h3>

                <span id="songCount">
                    0 songs
                </span>

            </div>


            <div id="playlist">

                <div class="empty">

                    No songs added yet.<br>
                    Click "+ Add Music" to add songs.

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
