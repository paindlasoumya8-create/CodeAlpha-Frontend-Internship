<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container">

            <h1>Explore Gallery</h1>

            <p>
                Discover beautiful moments through our collection
            </p>

        </div>

    </header>


    <!-- ================= FILTER BUTTONS ================= -->

    <section class="gallery-section">

        <div class="container">

            <div class="filters">

                <button class="filter-btn active" data-category="all">
                    All
                </button>

                <button class="filter-btn" data-category="nature">
                    Nature
                </button>

                <button class="filter-btn" data-category="city">
                    City
                </button>

                <button class="filter-btn" data-category="travel">
                    Travel
                </button>

            </div>


            <!-- ================= IMAGE GALLERY ================= -->

            <div class="gallery">

                <!-- Image 1 -->
                <div class="gallery-item" data-category="nature">

                    <img
                        src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                        alt="Beautiful mountain landscape"
                    >

                    <div class="image-overlay">

                        <h3>Mountain Escape</h3>

                        <p>Nature</p>

                    </div>

                </div>


                <!-- Image 2 -->
                <div class="gallery-item" data-category="nature">

                    <img
                        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                        alt="Green forest"
                    >

                    <div class="image-overlay">

                        <h3>Green Forest</h3>

                        <p>Nature</p>

                    </div>

                </div>


                <!-- Image 3 -->
                <div class="gallery-item" data-category="city">

                    <img
                        src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80"
                        alt="City skyline"
                    >

                    <div class="image-overlay">

                        <h3>City Lights</h3>

                        <p>City</p>

                    </div>

                </div>


                <!-- Image 4 -->
                <div class="gallery-item" data-category="travel">

                    <img
                        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                        alt="Beautiful beach"
                    >

                    <div class="image-overlay">

                        <h3>Beach Paradise</h3>

                        <p>Travel</p>

                    </div>

                </div>


                <!-- Image 5 -->
                <div class="gallery-item" data-category="travel">

                    <img
                        src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80"
                        alt="Mountain valley"
                    >

                    <div class="image-overlay">

                        <h3>Adventure</h3>

                        <p>Travel</p>

                    </div>

                </div>


                <!-- Image 6 -->
                <div class="gallery-item" data-category="city">

                    <img
                        src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80"
                        alt="City buildings"
                    >

                    <div class="image-overlay">

                        <h3>Urban Life</h3>

                        <p>City</p>

                    </div>

                </div>


                <!-- Image 7 -->
                <div class="gallery-item" data-category="nature">

                    <img
                        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80"
                        alt="Mountain lake"
                    >

                    <div class="image-overlay">

                        <h3>Peaceful Lake</h3>

                        <p>Nature</p>

                    </div>

                </div>


                <!-- Image 8 -->
                <div class="gallery-item" data-category="travel">

                    <img
                        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                        alt="Travel destination"
                    >

                    <div class="image-overlay">

                        <h3>Wanderlust</h3>

                        <p>Travel</p>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= LIGHTBOX ================= -->

    <div class="lightbox" id="lightbox">

        <!-- Close button -->
        <button class="close-btn" id="closeBtn">
            &times;
        </button>


        <!-- Previous button -->
        <button class="nav-btn prev-btn" id="prevBtn">
            &#10094;
        </button>


        <!-- Image container -->
        <div class="lightbox-content">

            <img id="lightboxImage" src="" alt="">

            <div class="lightbox-info">

                <h2 id="lightboxTitle"></h2>

                <p id="lightboxCategory"></p>

                <span id="imageCounter"></span>

            </div>

        </div>


        <!-- Next button -->
        <button class="nav-btn next-btn" id="nextBtn">
            &#10095;
        </button>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 Modern Image Gallery | Internship Project
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
